name: Release

# Every push to main produces a release. The version comes from the conventional commit messages
# since the last tag, so a release needs no manual step at all.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build everything but do not tag, release or publish
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  Configuration: Release

jobs:
  release:
    name: Build, tag and publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.0.0
        with:
          versionSpec: '5.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.0.0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier --check .

      - name: Stamp version
        id: stamp
        run: ./build/Set-Version.ps1 -Version '${{ steps.gitversion.outputs.assemblySemVer }}'
        shell: pwsh

      - name: Build
        run: msbuild TwinCAT.ProductivityTools.sln -restore -v:m -p:Configuration=Release -p:DeployExtension=false -p:ZipPackageCompressionLevel=normal

      - name: Test
        run: >
          dotnet test tests/TwinCAT.ProductivityTools.Core.Tests/TwinCAT.ProductivityTools.Core.Tests.csproj
          --configuration Release
          --no-restore
          --filter "Category!=E2E"

      - name: Integration test
        run: >
          dotnet test tests/TwinCAT.ProductivityTools.Integration.Tests/TwinCAT.ProductivityTools.Integration.Tests.csproj
          --configuration Release
          --no-restore
          --filter "Category!=E2E"

      - name: Build the installer
        shell: pwsh
        env:
          PRODUCTIVITYTOOLS_VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          choco install innosetup --no-progress --yes

          # The braces are required. "$env:ProgramFiles(x86)" expands $env:ProgramFiles and then
          # appends a literal "(x86)", which yields "C:\Program Files(x86)" without the space.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) {
            throw "The Inno Setup compiler was not found at $iscc"
          }

          & $iscc setup\TwinCAT.ProductivityTools.iss
          if ($LASTEXITCODE -ne 0) {
            throw "The Inno Setup compiler failed with exit code $LASTEXITCODE"
          }

      - name: Pack the TcPkg packages
        shell: pwsh
        run: ./build/Pack-TcPkg.ps1 -Version '${{ steps.gitversion.outputs.majorMinorPatch }}'

      - name: Collect the release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Get-ChildItem -Path dist -Filter *.exe -ErrorAction SilentlyContinue |
            Copy-Item -Destination artifacts/release
          Get-ChildItem -Path src -Filter *.vsix -Recurse |
            Where-Object { $_.FullName -match '\\bin\\Release\\' } |
            Copy-Item -Destination artifacts/release
          Get-ChildItem -Path artifacts/tcpkg -Filter *.nupkg -ErrorAction SilentlyContinue |
            Copy-Item -Destination artifacts/release

          $assets = @(Get-ChildItem artifacts/release)
          if ($assets.Count -eq 0) {
            throw 'No release assets were collected.'
          }

          $assets | Format-Table Name, Length

      - name: Upload the assets as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.gitversion.outputs.semVer }}
          path: artifacts/release/*

      - name: Create the GitHub release
        if: ${{ github.event_name == 'push' || !inputs.dry-run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gitversion.outputs.majorMinorPatch }}
          name: v${{ steps.gitversion.outputs.majorMinorPatch }}
          generate_release_notes: true
          files: artifacts/release/*

      - name: Publish the packages to GitHub Packages
        if: ${{ github.event_name == 'push' || !inputs.dry-run }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $source = "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          $packages = @(Get-ChildItem -Path artifacts/tcpkg -Filter *.nupkg -ErrorAction SilentlyContinue)

          if ($packages.Count -eq 0) {
            throw 'No packages were produced, so there is nothing to publish.'
          }

          # Without the explicit check a failed push in the middle of the loop would be masked by
          # the next iteration and the feed would end up incomplete while the run stays green.
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source $source --api-key $env:GITHUB_TOKEN --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "Publishing $($package.Name) failed with exit code $LASTEXITCODE"
            }
          }
